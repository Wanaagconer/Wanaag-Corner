<style>
.auth{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.auth-side{position:sticky;top:0;height:100svh;align-self:start;overflow:hidden;background:var(--basalte);color:var(--sel);display:flex;flex-direction:column;justify-content:space-between;padding:130px clamp(28px,5vw,72px) 48px;}
.auth-side::before{content:'';position:absolute;inset:0;background:radial-gradient(700px 500px at 70% 40%,rgba(171,126,54,.45),transparent 60%),radial-gradient(500px 400px at 0% 100%,rgba(79,92,61,.28),transparent 60%);}
.auth-orb{position:absolute;right:-12%;top:18%;width:min(60vh,520px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FBF1DD 0%,var(--lagon-clair) 22%,var(--lagon) 52%,rgba(79,92,61,.6) 75%,transparent 76%);
  filter:blur(2px);animation:authBreath 10s cubic-bezier(.45,0,.55,1) infinite;opacity:.9;}
.auth-orb::after{content:'';position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(221,192,146,.25);animation:authRing 10s cubic-bezier(.45,0,.55,1) infinite;}
@keyframes authBreath{0%,100%{transform:scale(.82)}40%,55%{transform:scale(1)}}
@keyframes authRing{0%,100%{transform:scale(.9);opacity:.2}40%,55%{transform:scale(1.04);opacity:.7}}
.auth-side > *:not(.auth-orb){position:relative;z-index:1;}
.auth-side h2{font-weight:300;font-size:clamp(44px,5.4vw,82px);line-height:.95;letter-spacing:-.04em;max-width:7em;}
.auth-rotator{position:relative;height:3.2em;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(20px,1.8vw,26px);color:rgba(244,238,226,.8);max-width:18em;}
.auth-rotator span{position:absolute;left:0;top:0;opacity:0;transform:translateY(16px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.auth-rotator span.on{opacity:1;transform:none;}
.auth-points{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:28px;}
.auth-points li{display:flex;gap:14px;align-items:baseline;font-size:15px;color:rgba(244,238,226,.7);}
.auth-points li b{font-family:var(--f-display);font-style:italic;font-weight:400;color:var(--lagon-clair);font-size:18px;min-width:1.2em;}
.auth-main{display:flex;align-items:center;justify-content:center;padding:120px clamp(24px,5vw,72px) 60px;}
.auth-box{width:100%;max-width:440px;}
.auth-box h1{font-weight:300;font-size:clamp(40px,4vw,58px);letter-spacing:-.035em;line-height:1;margin-bottom:12px;}
.auth-box > p.sub{color:var(--ardoise);margin-bottom:38px;}
.f-field{position:relative;margin-bottom:26px;}
.f-field label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:var(--basalte);}
.f-field .form-input{width:100%;font-family:var(--f-body);font-size:17px;color:var(--basalte);background:transparent;border:none;border-bottom:1px solid rgba(42,33,27,.2);padding:10px 44px 12px 0;outline:none;border-radius:0;transition:border-color .3s;}
.f-field .form-input::placeholder{color:var(--pierre);opacity:.8;}
.f-field .form-input{background:linear-gradient(90deg,var(--lagon),var(--lilas-2)) 0 100%/0 2px no-repeat;transition:background-size .7s var(--ease),border-color .3s;}
.f-field .form-input:focus{background-size:100% 2px;border-bottom-color:transparent;}
.f-field .hint{font-size:13px;color:var(--pierre);margin-top:8px;}
.f-field .err{font-size:13px;color:var(--danger);margin-top:6px;}
.f-eye{position:absolute;right:0;top:36px;width:38px;height:38px;border:none;background:none;cursor:pointer;color:var(--ardoise);display:grid;place-items:center;border-radius:50%;}
.f-eye:hover{color:var(--lagon);}
.f-eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.f-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
.f-meter i{height:3px;border-radius:3px;background:var(--trait);transition:background .4s;}
.f-meter-label{font-size:13px;color:var(--pierre);margin-top:6px;min-height:1.2em;}
.auth-errors{list-style:none;margin-bottom:26px;padding:14px 16px;border-radius:14px;background:rgba(180,71,63,.07);border:1px solid rgba(180,71,63,.2);font-size:14px;color:var(--danger);animation:shake .5s var(--ease);}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.auth-note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:30px;border-radius:16px;background:rgba(221,192,146,.22);font-size:14px;color:var(--basalte);}
.auth-note svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;stroke:var(--lagon);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.auth-submit{width:100%;margin-top:8px;padding:1.1rem 1.6rem;}
.auth-switch{margin-top:26px;font-size:15px;color:var(--ardoise);text-align:center;}
.auth-switch a{color:var(--lagon);text-decoration:none;font-weight:500;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease);}
.auth-switch a:hover{background-size:100% 1px;}
body.page-login .public-nav,body.page-register .public-nav{background:rgba(244,238,226,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 rgba(42,33,27,.07);}
@media(max-width:900px){
  .auth{grid-template-columns:1fr;}
  .auth-side{position:relative;height:auto;min-height:auto;padding:110px 24px 40px;}
  .auth-side h2{font-size:44px;}
  .auth-orb{width:280px;right:-90px;top:60px;}
  .auth-points{display:none;}
  .auth-main{padding:50px 22px 80px;}
  .f-field .form-input{font-size:16px;}
}
</style>
