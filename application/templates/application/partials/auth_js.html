<script>
(function(){
  var rot = document.querySelectorAll('.auth-rotator span'), i = 0;
  if (rot.length){ rot[0].classList.add('on'); setInterval(function(){ rot[i].classList.remove('on'); i=(i+1)%rot.length; rot[i].classList.add('on'); }, 4200); }
  var EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  document.querySelectorAll('.f-field input[type=password]').forEach(function(inp){
    var b = document.createElement('button'); b.type='button'; b.className='f-eye'; b.innerHTML=EYE; b.setAttribute('aria-label','Afficher le mot de passe');
    b.onclick = function(){ var s = inp.type==='password'; inp.type = s?'text':'password'; b.innerHTML = s?EYE_OFF:EYE; b.setAttribute('aria-label', s?'Masquer le mot de passe':'Afficher le mot de passe'); };
    inp.parentElement.appendChild(b);
  });
  var pw = document.querySelector('[data-meter] input');
  if (pw){
    var bars = document.querySelectorAll('.f-meter i'), lab = document.querySelector('.f-meter-label');
    var COL = ['#B4473F','#C79A3B','#BE8C3C','#AB7E36'], TXT = ['Trop court','Peut mieux faire','Correct','Solide'];
    pw.addEventListener('input', function(){
      var v = pw.value, s = 0;
      if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
      if (!v) s = 0;
      bars.forEach(function(b, k){ b.style.background = k < s ? COL[Math.max(0,s-1)] : ''; });
      lab.textContent = v ? TXT[Math.max(0,s-1)] : '';
    });
  }
})();
</script>
